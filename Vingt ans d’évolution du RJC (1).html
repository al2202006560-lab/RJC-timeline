<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vingt ans d’évolution du RJC</title>
<style>
:root{--bg:#eeece7;--card:#fff;--ink:#2f4858;--mute:#5f7a8a;--line:#8fa3ae;--cop:#2f4858;--coc:#5f7f94;--org:#1c2b36;--ring:#2f4858;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161d22;--card:#222c33;--ink:#e6edf1;--mute:#9db1bc;--line:#4a5c67;--cop:#7fb0c9;--coc:#a9c4d3;--org:#d9e4ea;--ring:#7fb0c9}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:clamp(26px,5vw,40px);margin:0 0 6px}
.sub{color:var(--mute);font-family:system-ui,sans-serif;font-size:14px;margin:0 0 22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;font-family:system-ui,sans-serif}
.filters button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.track{overflow-x:auto;padding:8px 0 14px}
.line{position:relative;display:flex;gap:0;min-width:760px;padding-top:6px}
.line::before{content:"";position:absolute;left:0;right:0;top:34px;height:4px;background:var(--line);border-radius:2px}
.node{flex:1;position:relative;background:none;border:0;cursor:pointer;color:var(--ink);font-family:system-ui,sans-serif;padding:0 2px 8px;text-align:center}
.dot{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 10px;border:4px solid var(--bg);background:var(--cop);position:relative;z-index:1;transition:transform .2s}
.node[data-t="COC"] .dot{background:var(--coc)}
.node[data-t="LGMS"] .dot,.node[data-t="ORG"] .dot{background:var(--org)}
.node:hover .dot{transform:scale(1.2)}
.node[aria-selected="true"] .dot{transform:scale(1.5);box-shadow:0 0 0 3px var(--ring)}
.node .y{font-weight:700;font-size:15px;display:block}
.node .n{font-size:12px;color:var(--mute);display:block;margin-top:2px}
.node.dim{opacity:.25}
.node:focus-visible{outline:2px solid var(--ring);border-radius:8px}
.panel{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:center;background:var(--card);border-radius:14px;padding:22px 24px;box-shadow:0 2px 14px rgba(0,0,0,.08);min-height:150px}
.panel figure{margin:0}.panel img{width:100%;height:auto;display:block;border-radius:10px}.panel figcaption{font:italic 11px system-ui,sans-serif;color:var(--mute);margin-top:6px;text-align:right}@media(max-width:680px){.panel{grid-template-columns:1fr}}
.panel .tag{display:inline-block;font-family:system-ui,sans-serif;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--bg)}
.panel h2{margin:10px 0 6px;font-size:26px}
.panel p{margin:0;font-size:18px;line-height:1.5}
.nav{display:flex;justify-content:space-between;margin-top:14px;font-family:system-ui,sans-serif}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:14px}
.nav button:disabled{opacity:.35;cursor:default}
.legend{margin-top:22px;color:var(--mute);font-style:italic;font-size:14px}
</style>
</head>
<body>
<main>
<h1>Vingt ans d’évolution du RJC</h1>
<p class="sub">Responsible Jewellery Council · cliquez sur une date ou utilisez les flèches ← →</p>
<div class="filters" id="filters"></div>
<div class="track"><div class="line" id="line" role="tablist"></div></div>
<div class="panel" id="panel" aria-live="polite"></div>
<div class="nav"><button id="prev">← Précédent</button><button id="next">Suivant →</button></div>

const L={ALL:"Tout",COP:"COP",COC:"COC",ORG:"Organisation",LGMS:"LGMS"};
const LN={COP:"Code de bonnes pratiques",COC:"Chaîne de responsabilité",ORG:"Organisation",LGMS:"Norme matériaux de synthèse"};
let cur=0,f="ALL";
const line=document.getElementById("line"),panel=document.getElementById("panel"),fl=document.getElementById("filters");
E.forEach((e,i)=>{const b=document.createElement("button");b.className="node";b.dataset.t=e.t;b.setAttribute("role","tab");
b.innerHTML=`<span class="dot"></span><span class="y">${e.y}</span><span class="n">${e.n}</span>`;
b.onclick=()=>go(i);line.appendChild(b)});
Object.keys(L).forEach(k=>{const b=document.createElement("button");b.textContent=L[k];b.setAttribute("aria-pressed",k==="ALL");
b.onclick=()=>{f=k;[...fl.children].forEach(c=>c.setAttribute("aria-pressed",c===b));render()};fl.appendChild(b)});
function go(i){cur=Math.max(0,Math.min(E.length-1,i));render();
line.children[cur].scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})}
function render(){
[...line.children].forEach((n,i)=>{n.setAttribute("aria-selected",i===cur);n.classList.toggle("dim",f!=="ALL"&&E[i].t!==f)});
const e=E[cur];
panel.innerHTML=`<div><span class="tag">${LN[e.t]}</span><h2>${e.y} — ${e.n}</h2><p>${e.d}</p></div><figure><img src="${IMG[e.y]}" alt="Photo RJC ${e.y} — ${e.n}"><figcaption>© Responsible Jewellery Council</figcaption></figure>`;
document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===E.length-1}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
render();
</script>
